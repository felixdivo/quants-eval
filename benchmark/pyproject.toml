[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quants-ablation"
version = "0.1.0"
description = "QuAnTS Q2 question-only, Q3 time-series-only, and Naive TS + Question ablations"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate==1.10.1",
  "aiohttp==3.12.15",
  "bitsandbytes==0.47.0",
  "datasets==4.1.1",
  "huggingface-hub==0.35.1",
  "nltk==3.9.1",
  "numpy==2.2.6",
  "pandas==2.3.2",
  "peft==0.17.1",
  "pyarrow==21.0.0",
  "requests==2.32.5",
  "rouge-score==0.1.2",
  "scikit-learn==1.7.2",
  "torch==2.8.0",
  "transformers==4.54.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
quants-prepare = "quants_ablation.prepare:main"
quants-train = "quants_ablation.train:main"
quants-generate = "quants_ablation.generate:main"
quants-judge = "quants_ablation.judge:main"
quants-aggregate = "quants_ablation.aggregate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quants_ablation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
