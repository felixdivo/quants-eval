name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==0.11.2
      - name: Validate locked environments
        run: |
          uv lock --check --project benchmark
          uv lock --check --project action_encoder
          uv lock --check --project analysis
      - name: Build Python packages
        run: |
          uv build --project benchmark
          uv build --project action_encoder
      - name: Check Python and shell syntax
        run: |
          python -m compileall -q benchmark/src action_encoder/src analysis
          for script in benchmark/slurm/*.sh benchmark/slurm/*.sbatch; do bash -n "$script"; done
          for script in action_encoder/slurm/*.sh action_encoder/slurm/*.sbatch; do bash -n "$script"; done
      - name: Lint action-encoder package
        run: uvx --from ruff==0.12.8 ruff check action_encoder/src action_encoder/tests action_encoder/analysis
